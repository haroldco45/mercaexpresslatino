<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merca Express Latino - Pedidos</title>
    <style>
        :root { --primary: #e63946; --secondary: #1d3557; --accent: #25d366; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; color: var(--secondary); }
        
        .header { text-align: center; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        /* REEMPLAZA "logo.png" por el nombre exacto de tu archivo en el repositorio */
        .logo { max-width: 180px; height: auto; margin-bottom: 10px; }
        
        .time-display { font-size: 1.1em; font-weight: bold; color: var(--primary); background: #fff1f2; padding: 8px; border-radius: 50px; display: inline-block; margin: 10px 0; border: 1px solid var(--primary); }
        
        .product-card { background: white; display: flex; align-items: center; padding: 15px; margin-bottom: 12px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
        .product-info { flex-grow: 1; }
        .product-info strong { font-size: 1.1em; display: block; }
        .product-info span { color: #666; font-weight: bold; }
        
        .controls { display: flex; align-items: center; gap: 15px; }
        .btn-qty { background: var(--primary); color: white; border: none; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; font-size: 20px; font-weight: bold; transition: 0.2s; }
        .btn-qty:active { transform: scale(0.9); }
        .qty-val { font-size: 1.2em; font-weight: bold; min-width: 20px; text-align: center; }

        .form-group { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        
        .btn-send { width: 100%; background: var(--accent); color: white; border: none; font-weight: bold; padding: 18px; font-size: 18px; border-radius: 15px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .btn-send:hover { background: #1eb954; }

        .footer { text-align: center; margin-top: 40px; padding-bottom: 20px; color: #888; border-top: 1px solid #ddd; pt: 20px; }
        .map-link { color: #3182ce; text-decoration: none; font-weight: bold; display: block; margin-top: 8px; }
    </style>
</head>
<body>

<div class="header">
    <img src="logo.png" alt="Vibras Positivas" class="logo">
    <h2 style="margin:5px 0;">Merca Express Latino</h2>
    <div class="time-display" id="londonTime">Cargando hora de Londres...</div>
    <p style="margin:5px 0; color: #555;">📍 705-707 Seven Sisters Road, London N15 5LA</p>
    <a href="https://www.google.com/maps/search/?api=1&query=705+707+seven+sisters+road+n15+5la+London" target="_blank" class="map-link">Ver ubicación en Google Maps</a>
</div>

<div id="productList">
    </div>

<div class="form-group">
    <h3>Finalizar Pedido</h3>
    <input type="text" id="nombre" placeholder="Tu Nombre Completo">
    <input type="text" id="direccion" placeholder="Dirección de Entrega en Londres">
    <input type="tel" id="celular" placeholder="Tu número de WhatsApp">
    <button class="btn-send" onclick="enviarPedido()">🚀 Enviar Factura a WhatsApp</button>
</div>

<div class="footer">
    App desarrollada por <strong>Vibras Positivas</strong>
</div>

<script>
    const productos = [
        { id: 1, nombre: "Pony Malta 330ml", precio: 1.50 },
        { id: 2, nombre: "Postobón Manzana 2L", precio: 3.80 },
        { id: 3, nombre: "Chocoramo Original", precio: 1.30 },
        { id: 4, nombre: "Arequipe Alpina", precio: 3.50 },
        { id: 5, nombre: "Galletas Festival", precio: 0.80 },
        { id: 6, nombre: "Bon Bon Bum (Paquete)", precio: 4.50 }
    ];

    let carrito = {};

    function updateTime() {
        const options = { 
            timeZone: 'Europe/London', 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit', 
            hour12: true,
            weekday: 'long',
            day: 'numeric',
            month: 'long'
        };
        const formatter = new Intl.DateTimeFormat('es-ES', options);
        document.getElementById('londonTime').innerText = "Londres: " + formatter.format(new Date());
    }
    setInterval(updateTime, 1000);
    updateTime();

    function renderProducts() {
        const list = document.getElementById('productList');
        list.innerHTML = productos.map(p => `
            <div class="product-card">
                <div class="product-info">
                    <strong>${p.nombre}</strong>
                    <span>£${p.precio.toFixed(2)}</span>
                </div>
                <div class="controls">
                    <button class="btn-qty" onclick="cambiarCant(${p.id}, -1)">-</button>
                    <span class="qty-val" id="cant-${p.id}">0</span>
                    <button class="btn-qty" onclick="cambiarCant(${p.id}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    function cambiarCant(id, delta) {
        carrito[id] = (carrito[id] || 0) + delta;
        if (carrito[id] < 0) carrito[id] = 0;
        document.getElementById(`cant-${id}`).innerText = carrito[id];
    }

    function enviarPedido() {
        const nombre = document.getElementById('nombre').value;
        const direccion = document.getElementById('direccion').value;
        const celular = document.getElementById('celular').value;

        if (!nombre || !direccion || !celular) {
            alert("Por favor, completa todos los campos.");
            return;
        }

        let mensaje = `*🧾 FACTURA DE PEDIDO*\n`;
        mensaje += `*Tienda:* Merca Express Latino\n`;
        mensaje += `*Fecha:* ${new Date().toLocaleDateString('es-ES')}\n`;
        mensaje += `----------------------------\n`;
        mensaje += `*Cliente:* ${nombre}\n`;
        mensaje += `*Dirección:* ${direccion}\n`;
        mensaje += `*Tel:* ${celular}\n\n`;
        mensaje += `*PRODUCTOS:*\n`;

        let total = 0;
        let tieneProductos = false;

        productos.forEach(p => {
            const cant = carrito[p.id] || 0;
            if (cant > 0) {
                const subtotal = p.precio * cant;
                mensaje += `✅ ${p.nombre} (x${cant}) - £${subtotal.toFixed(2)}\n`;
                total += subtotal;
                tieneProductos = true;
            }
        });

        if (!tieneProductos) {
            alert("Selecciona al menos un producto.");
            return;
        }

        mensaje += `\n*TOTAL A PAGAR: £${total.toFixed(2)}*\n`;
        mensaje += `----------------------------\n`;
        mensaje += `_App desarrollada por Vibras Positivas_`;

        // Número de la tienda proporcionado: +44 7542 455556
        const url = `https://wa.me/447542455556?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }

    renderProducts();
</script>

</body>
</html>
